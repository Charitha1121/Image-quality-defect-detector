[project]
name = "image-quality-defect-detector"
version = "0.1.0"
description = "Image quality defect detection API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "python-multipart==0.0.32",
    "numpy==2.2.6",
    "opencv-python-headless==5.0.0.93",
    "pandas==2.3.3",
    "scikit-learn==1.7.2",
    "scipy==1.15.3",
    "joblib==1.5.3",
    "SQLAlchemy==2.0.52",
    "torch==2.13.0+cpu",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.vercel]
entrypoint = "backend.app.main:app"